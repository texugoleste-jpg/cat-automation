name: 🐱 CSBuy Cat Bot v2

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Salvar screenshots de debug?'
        required: false
        default: 'true'

jobs:
  cat-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: |
          pip install playwright opencv-python-headless numpy pillow
          playwright install chromium --with-deps

      - name: 🐱 Rodar bot
        env:
          CSSBUY_COOKIES: ${{ secrets.CSSBUY_COOKIES }}
        run: python bot.py

      - name: 📸 Upload screenshots de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: screenshot_*.png
          retention-days: 3
          if-no-files-found: ignore
